# BKK Nettleie
# Energiledd øre/kWh	Dag (06-22)	Natt og helg/helligdag
# Januar-mars	        47,38	      35,58
# April-desember	    55,73	      43,93

template:
  - !include templates/bir.yaml

  - sensor:
      - unique_id: 0a65dbd0-dc0b-463e-924c-765e32a08266
        name: "Nettleie BKK"
        unit_of_measurement: "NOK/kWh"
        device_class: monetary
        state_class: measurement
        icon: mdi:currency-usd
        state: >
          {% set month = now().month %}
          {% set hour = now().hour %}
          {% set weekend = now().weekday() >= 5 %}
          {% set day_hours = hour >= 6 and hour < 22 and not weekend %}
          {% if month <= 3 %}
            {{ 0.4738 if day_hours else 0.3558 }}
          {% else %}
            {{ 0.5573 if day_hours else 0.4393 }}
          {% endif %}

  - sensor:
      - name: "UPS Runtime Remaining"
        unique_id: ups_runtime_remaining
        icon: mdi:battery-clock
        state: "{{ (states('sensor.ups_battery_runtime_2') | int / 60) | round(0) }}"
        unit_of_measurement: "min"

  - sensor:
      - name: Brume 3 (MT-5000)
        icon: mdi:lan-connect
        state: >
          {% if is_state('device_tracker.unifi_ijjc23er_94_83_c4_c6_1a_fd', 'home') %}
            Connected
          {% else %}
            Disconnected
          {% endif %}

# PowerOps

binary_sensor:
  - platform: rest
    name: PowerOps Armed
    resource: http://powerops.core.vninja.com/api/status
    headers:
      X-PowerOps-Token: !secret powerops_token
    value_template: "{{ value_json.armed }}"
    scan_interval: 30

  - platform: rest
    name: PowerOps NUT Connected
    resource: http://powerops.core.vninja.com/api/status
    headers:
      X-PowerOps-Token: !secret powerops_token
    value_template: "{{ value_json.get('upsError', '') == '' }}"
    device_class: connectivity
    scan_interval: 30

  - platform: rest
    name: PowerOps Proxmox Connected
    resource: http://powerops.core.vninja.com/api/status
    headers:
      X-PowerOps-Token: !secret powerops_token
    value_template: "{{ value_json.get('resourcesError', '') == '' }}"
    device_class: connectivity
    scan_interval: 30

