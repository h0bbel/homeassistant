night_mode_script:
  sequence:
  - action: input_boolean.turn_on
    metadata: {}
    data: {}
    target:
      entity_id: input_boolean.night_mode
  alias: Night Mode
  description: Turn on Night Mode helper
light_color_hs_helper:
  sequence:
  - action: light.turn_on
    target:
      entity_id: '{{ target_light }}'
    data:
      hs_color: "{% set new_value = (state_attr(target_light, 'hs_color')[0] + iif(mode
        == \"down\", -1, +1) * color_hue_step)  %} {{ [iif(new_value > 360, \n    new_value
        - 360,\n    iif(new_value < 0, \n        new_value + 360, \n        new_value),
        \n    new_value), \n  color_saturation - 1 ] }} "
  alias: light_color_hs_helper
  fields:
    target_light:
      name: Light
      description: Light entity
      selector:
        entity:
          filter:
            domain: light
      required: true
    color_hue_step:
      name: Change of color hue per step
      default: 5
      selector:
        number:
          mode: box
      required: true
    color_saturation:
      name: Color saturation
      default: 100
      selector:
        number:
          mode: box
      required: true
    mode:
      selector:
        select:
          options:
          - up
          - down
      required: true
      default: up
      name: Mode
      description: Select switch mode
  description: Switch color hue/saturation of light in steps
light_color_temp_helper:
  sequence:
  - action: light.turn_on
    target:
      entity_id: '{{ target_light }}'
    data:
      color_temp_kelvin: "{% if state_attr(target_light, 'color_temp_kelvin') is none
        %} \n  {{ max_color_temp }} \n{% else %}  \n  {% if mode == \"cycle\" and
        state_attr(target_light, 'color_temp_kelvin')\n  == max_color_temp %}\n    {{min_color_temp}}\n
        \ {% else %}  \n    {% set new_value = state_attr(target_light, 'color_temp_kelvin')+iif(mode
        == \"down\", -1, +1) * color_temp_step %}\n    {{ [([new_value, max_color_temp]
        | min), min_color_temp] | max}} \n  {% endif %} \n{% endif %} "
  alias: light_color_temp_helper
  fields:
    target_light:
      name: Light
      description: Light entity
      selector:
        entity:
          filter:
            domain: light
      required: true
    min_color_temp:
      name: Minimal color temperature
      default: 2200
      selector:
        number:
          mode: box
      required: true
    max_color_temp:
      name: Maximal color temperature
      default: 4000
      selector:
        number:
          mode: box
      required: true
    color_temp_step:
      name: Change of color temperature per step
      default: 300
      selector:
        number:
          mode: box
      required: true
    mode:
      selector:
        select:
          options:
          - up
          - down
          - cycle
      required: true
      default: cycle
      name: Mode
      description: Select switch mode
  description: Switch color temperature of light in steps
night_mode_lights_off:
  alias: Night Mode Lights Off
  description: 'Shared action list for entering night mode: turns off the usual evening
    lights/switches, locks the front door. Called both when input_boolean.night_mode
    turns on and by the 02:00 auto-enable.'
  sequence:
  - action: switch.turn_off
    target:
      entity_id: switch.verisure_switch
  - action: switch.turn_off
    target:
      entity_id: group.living_room_switches
  - action: light.turn_off
    target:
      entity_id:
      - light.left_elgato_key_light_air
      - light.right_elgato_keylight_air
  - action: light.turn_off
    target:
      entity_id:
      - light.hue_go_1
      - light.hue_go_2
  - action: light.turn_off
    target:
      entity_id: light.tradfri_driver_idanas_cabinet
  - action: light.turn_off
    target:
      entity_id: light.night_mode_off
  - action: light.turn_off
    target:
      entity_id: light.kitchen_counter_lights
  - action: homeassistant.turn_off
    target:
      entity_id: group.bar_group
  - action: lock.lock
    target:
      entity_id: lock.inngangsdor
    data:
      code: 056805
spa_temp_up:
  alias: Spa Temp Up
  description: Bumps the spa's target temperature up by 0.5°C, clamped to the device's
    max (40°C). Exists so the Bar Cast dashboard can use a big button instead of the
    cramped tile stepper.
  sequence:
  - action: climate.set_temperature
    target:
      entity_id: climate.outside_mspa_mono_heater_control
    data:
      temperature: '{{ [state_attr(''climate.outside_mspa_mono_heater_control'', ''temperature'')
        | float(35) + 0.5, 40] | min }}'
  mode: single
spa_temp_down:
  alias: Spa Temp Down
  description: Bumps the spa's target temperature down by 0.5°C, clamped to the device's
    min (20°C). Exists so the Bar Cast dashboard can use a big button instead of the
    cramped tile stepper.
  sequence:
  - action: climate.set_temperature
    target:
      entity_id: climate.outside_mspa_mono_heater_control
    data:
      temperature: '{{ [state_attr(''climate.outside_mspa_mono_heater_control'', ''temperature'')
        | float(35) - 0.5, 20] | max }}'
  mode: single
