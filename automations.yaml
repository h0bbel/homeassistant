- id: '1789246278964'
  alias: iOS Shortcuts Mode Control
  description: 'Native replacement for Node-RED''s "iOS/Watch Events" flow: iOS Shortcuts
    actions (Night, party-mode, away-mode) toggle the corresponding mode booleans.
    The Night action now only sets night_mode on — automation.night_mode_activated
