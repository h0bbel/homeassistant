      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.night_mode
    - conditions:
      - '{{ trigger.event.data.event.actionName == ''party-mode'' }}'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.party_mode
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.barmode
    - conditions:
      - '{{ trigger.event.data.event.actionName == ''away-mode'' }}'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.away_mode
  mode: single
- id: '1789246996212'
  alias: Sonos Night/Day Mode
  description: 'Native replacement for Node-RED''s "Sonos Night/Day Mode" flow: enables
    night sound + speech enhancement at 23:00 (skipped if party_mode is on). At 08:00
    disables night sound and keeps speech enhancement ON.'
  triggers:
  - trigger: time
    at: '23:00:00'
    id: night
  - trigger: time
    at: 08:00:00
    id: day
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: night
      - condition: state
        entity_id: input_boolean.party_mode
        state: 'off'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.sonos_living_room_soundbar_night_sound
      - action: switch.turn_on
        target:
          entity_id: switch.sonos_living_room_soundbar_speech_enhancement_2
      - action: notify.send_message
        target:
          entity_id: notify.household_notify
        data:
          title: "\U0001F50A Sonos"
          message: Night Mode enabled
    - conditions:
      - condition: trigger
        id: day
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.sonos_living_room_soundbar_night_sound
      - action: switch.turn_on
        target:
          entity_id: switch.sonos_living_room_soundbar_speech_enhancement_2
      - action: notify.send_message
        target:
          entity_id: notify.household_notify
        data:
          title: "\U0001F50A Sonos"
          message: Night Mode disabled (speech enhancement stays on)
  mode: single
- id: '1789472542754'
  alias: Water Heater Draw Logging
  description: Brackets a fast-rate drain event (detected via L/min derivative, so
    slow standby heat loss is never mistaken for a real draw) and logs the total volume
    once the rate recovers. Tracks the MINIMUM raw capacity seen during the active
    window (updated on every raw sensor report while draw_detected is on) rather than
    reading a single live value at the 'off' moment — the raw capacity sensor only
    reports every ~10min, and reading it live at 'off' time was producing 0 or negative
    drops because the raw sensor hadn't caught up with the actual minimum yet (or
    had already started climbing back up during reheating).
  triggers:
  - trigger: state
    entity_id: binary_sensor.laundry_room_charger3_9454c5a69354_water_heater_draw_detected
    to: 'on'
    id: start
  - trigger: state
    entity_id: binary_sensor.laundry_room_charger3_9454c5a69354_water_heater_draw_detected
    to: 'off'
    id: end
  - trigger: state
    entity_id: sensor.charger3_9454c5a69354_capacity_mixed_water_40degc
    id: capacity_update
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: start
      sequence:
      - variables:
          current_capacity: '{{ states(''sensor.charger3_9454c5a69354_capacity_mixed_water_40degc'')
            | float(0) }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.water_heater_draw_start_capacity
        data:
          value: '{{ current_capacity }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.water_heater_draw_min_capacity
        data:
          value: '{{ current_capacity }}'
    - conditions:
      - condition: trigger
        id: capacity_update
      - condition: state
        entity_id: binary_sensor.laundry_room_charger3_9454c5a69354_water_heater_draw_detected
        state: 'on'
      sequence:
      - variables:
          current_capacity: '{{ states(''sensor.charger3_9454c5a69354_capacity_mixed_water_40degc'')
            | float(0) }}'
          tracked_min: '{{ states(''input_number.water_heater_draw_min_capacity'')
            | float(0) }}'
      - if:
        - condition: template
          value_template: '{{ current_capacity < tracked_min }}'
        then:
        - action: input_number.set_value
          target:
            entity_id: input_number.water_heater_draw_min_capacity
          data:
            value: '{{ current_capacity }}'
    - conditions:
      - condition: trigger
        id: end
      sequence:
      - variables:
          drop: '{{ states(''input_number.water_heater_draw_start_capacity'') | float(0)
            - states(''input_number.water_heater_draw_min_capacity'') | float(0) }}'
      - if:
        - condition: template
          value_template: '{{ drop >= 8 }}'
        then:
        - action: input_number.set_value
          target:
            entity_id: input_number.water_heater_last_draw
          data:
            value: '{{ drop }}'
  mode: single
- id: '1789895580171'
  alias: Spa Offline Notification
  description: Mirrors the UPS Unavailable Notification pattern. A 5-minute debounce
    (longer than the UPS's 1-minute) filters out the MSpa integration's normal self-healing
    re-auth blips (typically recovers within ~2 minutes), so this only fires on a
    real, sustained outage.
  triggers:
  - trigger: state
    entity_id:
    - climate.outside_mspa_mono_heater_control
    to: unavailable
    for:
      minutes: 5
  conditions: []
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.household_notify
    data:
      title: "\U0001F50C Spa Offline"
      message: Mspa Mono has been unavailable for 5+ minutes
  mode: single
- id: '1789895582633'
  alias: Spa Online Notification
  description: Mirrors the UPS Online Notification pattern.
  triggers:
  - trigger: state
    entity_id:
    - climate.outside_mspa_mono_heater_control
    from: unavailable
    to:
    for:
      minutes: 1
  conditions: []
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.household_notify
    data:
      title: "\U0001F6CB️ Spa Online"
      message: Mspa Mono connection restored
  mode: single
- id: '1789895584286'
  alias: Spa Low Temperature Alert
  description: Warns if the spa water temperature drops below its normal operating
    minimum (20°C) while expected to be heated — e.g. heater failure or power loss.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.spa_current_temperature
    below: 20
    for:
      minutes: 10
  conditions: []
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.household_notify
    data:
      title: "\U0001F976 Spa Water Cold"
      message: Spa temperature has been below 20°C for 10+ minutes
  mode: single
- id: '1789981150402'
  alias: Network Offline Notification
  description: Alerts when the local network (UniFi controller/gateway) becomes unreachable
    via ping, distinct from the UPS USB-link alert. A 3-minute debounce filters single
    dropped pings.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.192_168_5_2
    to: 'off'
    for:
      minutes: 3
  conditions: []
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.household_notify
    data:
      title: "\U0001F4F6 Network Unreachable"
      message: Gateway/UniFi controller not responding for 3+ minutes
  mode: single
- id: '1789981152157'
  alias: Network Online Notification
  description: Alerts when the local network (UniFi controller/gateway) is reachable
    again.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.192_168_5_2
    to: 'on'
    for:
      minutes: 1
  conditions: []
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.household_notify
    data:
      title: "\U0001F4F6 Network Reachable"
      message: Gateway/UniFi controller responding again
  mode: single
- id: '1789981365396'
  alias: nut-1 Host Offline Notification
  description: Alerts when the nut-1 host itself is unreachable on the network, distinct
    from a USB/driver data-stale issue on an otherwise-reachable host.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.nut_1_core_vninja_com
    to: 'off'
    for:
      minutes: 3
  conditions: []
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.household_notify
    data:
      title: "\U0001F5A5️ nut-1 Host Unreachable"
      message: nut-1 not responding to ping for 3+ minutes — host/VM may be down,
        not just a USB issue
  mode: single
- id: '1789981367069'
  alias: nut-1 Host Online Notification
  description: Alerts when the nut-1 host is reachable again.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.nut_1_core_vninja_com
    to: 'on'
    for:
      minutes: 1
  conditions: []
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.household_notify
    data:
      title: "\U0001F5A5️ nut-1 Host Reachable"
      message: nut-1 responding to ping again
  mode: single
- id: '1793828051804'
  alias: Nest Hub Dashboard Cast
  description: Re-casts the dashboard to a Nest Hub display via the cast container
    (POST to 192.168.31.41:8090) when the hub has been off for 3 minutes. Replaces
    the Node-RED 'Nest Hub ... State' flows. A failed POST sends a notification.
  triggers:
  - trigger: state
    entity_id: media_player.nesthube5f7_3
    to: 'off'
    for:
      minutes: 3
    id: livingroom
  - trigger: state
    entity_id: media_player.nesthub6398_2
    to: 'off'
    for:
      minutes: 3
    id: bar
  - trigger: state
    entity_id: media_player.nesthub876d
    to: 'off'
    for:
      minutes: 3
    id: bedroom
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: livingroom
      sequence:
      - action: rest_command.cast_livingroom
        response_variable: cast_result
        continue_on_error: true
      - if:
        - condition: template
          value_template: '{{ cast_result is not defined or cast_result.status | int(0)
            >= 400 }}'
        then:
        - action: notify.send_message
          target:
            entity_id: notify.household_notify
          data:
            title: Dashboard cast failed
            message: Casting to the Living Room display failed. Check the cast container
              at 192.168.31.41:8090.
    - conditions:
      - condition: trigger
        id: bar
      sequence:
      - action: rest_command.cast_bar
        response_variable: cast_result
        continue_on_error: true
      - if:
        - condition: template
          value_template: '{{ cast_result is not defined or cast_result.status | int(0)
            >= 400 }}'
        then:
        - action: notify.send_message
          target:
            entity_id: notify.household_notify
          data:
            title: Dashboard cast failed
            message: Casting to the Bar display failed. Check the cast container at
              192.168.31.41:8090.
    - conditions:
      - condition: trigger
        id: bedroom
      sequence:
      - action: rest_command.cast_bedroom
        response_variable: cast_result
        continue_on_error: true
      - if:
        - condition: template
          value_template: '{{ cast_result is not defined or cast_result.status | int(0)
            >= 400 }}'
        then:
        - action: notify.send_message
          target:
            entity_id: notify.household_notify
          data:
            title: Dashboard cast failed
            message: Casting to the Bedroom display failed. Check the cast container
              at 192.168.31.41:8090.
  mode: parallel
  max: 3
- id: '1793829090749'
  alias: Scenic Scheduled Pre-heat
  description: One-off air-con start for the Scenic. Starts 10 minutes before the
    date and time in input_datetime.scenic_ready_by, at the temperature in input_number.scenic_pre_heat_temperature,
    while input_boolean.scenic_pre_heat_scheduled is on. Turns the schedule off after
    it runs.
  triggers:
  - trigger: time
    at:
      entity_id: input_datetime.scenic_ready_by
      offset: -00:10:00
  conditions:
  - condition: state
    entity_id: input_boolean.scenic_pre_heat_scheduled
    state: 'on'
  actions:
  - action: renault.ac_start
    data:
      vehicle: b1c866f469a582c5ab78e186acf0cadc
      temperature: '{{ states(''input_number.scenic_pre_heat_temperature'') | float(21)
        }}'
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.scenic_pre_heat_scheduled
  mode: single
- id: '1794577644958'
  alias: Scenic Ready-by Date + Time -> Ready-by
  description: Combines the date picker (input_datetime.scenic_ready_by_date) and
    the 24h time dropdown (input_select.scenic_ready_by_time) into input_datetime.scenic_ready_by,
    which the Scenic Scheduled Pre-heat automation triggers on.
  triggers:
  - trigger: state
    entity_id:
    - input_datetime.scenic_ready_by_date
    - input_select.scenic_ready_by_time
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id:
      - input_datetime.scenic_ready_by_date
      - input_select.scenic_ready_by_time
      state:
      - unknown
      - unavailable
  actions:
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.scenic_ready_by
    data:
      datetime: '{{ states(''input_datetime.scenic_ready_by_date'') }} {{ states(''input_select.scenic_ready_by_time'')
        }}:00'
  mode: restart
- id: '1794660563749'
  alias: Scenic charge session capacity estimate
  description: Records the car's charge level and the Easee lifetime energy when a
    charge starts. When it ends, and the session added at least 15 percentage points,
    estimates the battery's usable capacity from the energy delivered (times the charging
    efficiency helper) divided by the charge gained, and stores it in input_number.scenic_capacity_estimate.
    A rolling median of those estimates and a health percentage against the nominal
    capacity are derived by helpers.
  triggers:
  - trigger: state
    entity_id: binary_sensor.scenic_charging
    from: 'off'
    to: 'on'
    id: start
  - trigger: state
    entity_id: binary_sensor.scenic_charging
    from: 'on'
    to: 'off'
    id: end
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: start
      - condition: template
        value_template: '{{ is_number(states(''sensor.scenic_battery'')) and is_number(states(''sensor.easee_e_lifetime_energy''))
          }}'
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.scenic_charge_start_soc
        data:
          value: '{{ states(''sensor.scenic_battery'') | float }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.scenic_charge_start_energy
        data:
          value: '{{ states(''sensor.easee_e_lifetime_energy'') | float }}'
    - conditions:
      - condition: trigger
        id: end
      sequence:
      - variables:
          soc_start: '{{ states(''input_number.scenic_charge_start_soc'') | float(0)
            }}'
          soc_end: '{{ states(''sensor.scenic_battery'') | float(0) }}'
          energy_start: '{{ states(''input_number.scenic_charge_start_energy'') |
            float(0) }}'
          energy_end: '{{ states(''sensor.easee_e_lifetime_energy'') | float(0) }}'
          efficiency: '{{ states(''input_number.scenic_charging_efficiency'') | float(0.92)
            }}'
      - if:
        - condition: template
          value_template: '{{ soc_start > 0 and (soc_end - soc_start) >= 15 and (energy_end
            - energy_start) > 0 }}'
        then:
        - action: input_number.set_value
          target:
            entity_id: input_number.scenic_capacity_estimate
          data:
            value: '{{ ((energy_end - energy_start) * efficiency / ((soc_end - soc_start)
              / 100)) | round(2) }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.scenic_charge_start_soc
        data:
          value: 0
  mode: single
- id: '1794661101967'
  alias: Scenic trip log
  description: Detects a trip from the car's mileage updates. A trip starts when mileage
    rises while no trip is open, stays open while mileage keeps rising, and is closed
    after 30 minutes without a rise. On close it estimates energy from the charge
    change times the estimated usable capacity, stores the last trip values and adds
    a line to the Scenic trips to-do list. Start and end times are the times the car
    reported, so they are approximate.
  triggers:
  - trigger: state
    entity_id: sensor.scenic_mileage
    id: moved
  - trigger: state
    entity_id: sensor.scenic_battery
    id: battery
  - trigger: state
    entity_id: timer.scenic_trip_timeout
    from: active
    to: idle
    id: done
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: battery
      - condition: state
        entity_id: timer.scenic_trip_timeout
        state: idle
      - condition: template
        value_template: '{{ is_number(trigger.to_state.state) }}'
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.scenic_trip_start_soc
        data:
          value: '{{ trigger.to_state.state | float }}'
    - conditions:
      - condition: trigger
        id: moved
      - condition: template
        value_template: '{{ trigger.from_state is not none and is_number(trigger.from_state.state)
          and is_number(trigger.to_state.state) and (trigger.to_state.state | float)
          > (trigger.from_state.state | float) }}'
      sequence:
      - if:
        - condition: state
          entity_id: timer.scenic_trip_timeout
          state: idle
        then:
        - action: input_number.set_value
          target:
            entity_id: input_number.scenic_trip_start_mileage
          data:
            value: '{{ trigger.from_state.state | float }}'
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.scenic_trip_start
          data:
            datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.scenic_trip_end_mileage
        data:
          value: '{{ trigger.to_state.state | float }}'
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.scenic_last_trip_end
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
      - action: timer.start
        target:
          entity_id: timer.scenic_trip_timeout
    - conditions:
      - condition: trigger
        id: done
      sequence:
      - variables:
          start_km: '{{ states(''input_number.scenic_trip_start_mileage'') | float(0)
            }}'
          end_km: '{{ states(''input_number.scenic_trip_end_mileage'') | float(0)
            }}'
          dist: '{{ (end_km - start_km) | round(1) }}'
          soc_start: '{{ states(''input_number.scenic_trip_start_soc'') | float(0)
            }}'
          soc_end: '{{ states(''sensor.scenic_battery'') | float(0) }}'
          capacity: '{{ states(''sensor.scenic_capacity_estimate_median'') | float(0)
            }}'
          d_soc: '{{ soc_start - soc_end }}'
          energy: '{{ ((d_soc / 100 * capacity) | round(2)) if (d_soc > 0 and soc_end
            > 0) else 0 }}'
          cons: '{{ ((energy / dist * 100) | round(1)) if (dist >= 3 and energy >
            0) else 0 }}'
          s: '{{ states(''input_datetime.scenic_trip_start'') }}'
          e: '{{ states(''input_datetime.scenic_last_trip_end'') }}'
          label: '{{ s[8:10] }}.{{ s[5:7] }} {{ s[11:16] }}-{{ e[11:16] }}'
      - if:
        - condition: template
          value_template: '{{ dist >= 0.5 }}'
        then:
        - action: input_number.set_value
          target:
            entity_id: input_number.scenic_last_trip_distance
          data:
            value: '{{ dist }}'
        - action: input_number.set_value
          target:
            entity_id: input_number.scenic_last_trip_energy
          data:
            value: '{{ energy }}'
        - if:
          - condition: template
            value_template: '{{ cons > 0 }}'
          then:
          - action: input_number.set_value
            target:
              entity_id: input_number.scenic_last_trip_consumption
            data:
              value: '{{ cons }}'
        - action: counter.increment
          target:
            entity_id: counter.scenic_trips_logged
        - action: todo.add_item
          target:
            entity_id: todo.scenic_trips
          data:
            item: '{{ label }} · {{ dist }} km · {{ soc_start | int }} to {{ soc_end
              | int }}% · {{ energy }} kWh · {{ cons if cons > 0 else ''n/a'' }} kWh/100
              km'
            description: Energy is estimated from the charge change times the estimated
              usable capacity ({{ capacity }} kWh). Times are when the car reported,
              so they are approximate.
        - event: scenic_trip_logged
          event_data:
            label: '{{ label }}'
            km: '{{ dist }}'
            soc_start: '{{ soc_start | int }}'
            soc_end: '{{ soc_end | int }}'
            kwh: '{{ energy }}'
            cons: '{{ cons }}'
  mode: queued
  max: 10
