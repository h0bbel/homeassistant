        entity_id: input_boolean.night_mode
    - action: notify.send_message
      target:
        entity_id: notify.household_notify
      data:
        title: "\U0001F6CC Night Mode"
        message: Disabled
  - if:
    - condition: state
      entity_id: input_boolean.party_mode
      state: 'on'
    then:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.party_mode
    - action: notify.send_message
      target:
        entity_id: notify.household_notify
      data:
        title: "\U0001F37E Party Mode"
        message: Disabled
  mode: single
