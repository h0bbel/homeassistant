- id: '1788091393692'
  alias: Freezer & Fridge Alerts
  description: Notify if the freezer or fridge temperature climbs too high, or a door
    is left open.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.fridge_freezer_temperature
    above: -12
    for:
      minutes: 5
    id: freezer_temp_high
  - trigger: numeric_state
    entity_id: sensor.fridge_temperature
    above: 8
    for:
      minutes: 5
    id: fridge_temp_high
  - trigger: state
    entity_id: binary_sensor.fridge_freezer_door_open
    to: 'on'
    for:
      minutes: 5
    id: freezer_door_open
  - trigger: state
    entity_id: binary_sensor.fridge_door_open
    to: 'on'
    for:
      minutes: 5
    id: fridge_door_open
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: freezer_temp_high
      sequence:
      - action: notify.send_message
        target:
          entity_id: notify.household_notify
        data:
          title: "\U0001F9CA Freezer Warning"
          message: Freezer temperature is {{ states('sensor.fridge_freezer_temperature')
            }}°C — above normal for 5+ minutes.
          data:
            push:
              sound:
                critical: 1
                name: default
                volume: 1
    - conditions:
      - condition: trigger
        id: fridge_temp_high
      sequence:
      - action: notify.send_message
        target:
          entity_id: notify.household_notify
        data:
          title: "\U0001F976 Fridge Warning"
          message: Fridge temperature is {{ states('sensor.fridge_temperature') }}°C
            — above normal for 5+ minutes.
          data:
            push:
              sound:
                critical: 1
                name: default
                volume: 1
    - conditions:
      - condition: trigger
        id: freezer_door_open
      sequence:
      - action: notify.send_message
        target:
          entity_id: notify.household_notify
        data:
          title: "\U0001F6AA Freezer Door Open"
          message: The freezer door has been open for 5+ minutes.
    - conditions:
      - condition: trigger
        id: fridge_door_open
      sequence:
      - action: notify.send_message
        target:
          entity_id: notify.household_notify
        data:
          title: "\U0001F6AA Fridge Door Open"
          message: The fridge door has been open for 5+ minutes.
  mode: single
