- id: '1789244626156'
  alias: Kitchen Lights Remote
  description: 'Native replacement for Node-RED''s "Kitchen Lights" flow: TSB01 (TRADFRI
    shortcut button) and BILRESA dual button (Matter) both control the kitchen counter
    lights -- Button 1 = toggle, Button 2 = dim 50%. Triggers on the event entity''s
    own state (a fresh timestamp on every press) rather than the event_type attribute,
    then filters to multi_press_1 in a condition -- an attribute-based ''to'' trigger
    silently misses consecutive same-type presses (e.g. two single-clicks in a row
    both report event_type=multi_press_1, which HA''s attribute trigger sees as no
    change and won''t re-fire on).'
  triggers:
  - trigger: device
    domain: mqtt
    device_id: 68be30184464a41c9d77cb9947a29c88
    type: action
    subtype: 'on'
    id: toggle
  - trigger: device
    domain: mqtt
    device_id: 68be30184464a41c9d77cb9947a29c88
    type: action
    subtype: brightness_move_up
    id: dim_50
  - trigger: state
    entity_id: event.bilresa_dual_button_button_1
    id: toggle
  - trigger: state
    entity_id: event.bilresa_dual_button_button_2
    id: dim_50
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: toggle
      - '{{ trigger.platform != ''state'' or trigger.to_state.attributes.get(''event_type'')
        == ''multi_press_1'' }}'
      sequence:
      - action: light.toggle
        target:
          entity_id: light.kitchen_counter_lights
        data:
          brightness: 255
          transition: 2
    - conditions:
      - condition: trigger
        id: dim_50
      - '{{ trigger.platform != ''state'' or trigger.to_state.attributes.get(''event_type'')
        == ''multi_press_1'' }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.kitchen_counter_lights
        data:
          brightness: 127
  mode: single
- id: '1789244974720'
  alias: Unavailable Lights Check
  description: Alerts when the number of unavailable lights has gone UP and stayed
    up for 5 minutes (a light that drops out briefly, or a light coming back, does
    not alert), plus a reminder every morning at 09:00 while any light is still unavailable.
  triggers:
  - trigger: state
    entity_id: sensor.unavailable_lights
    to:
    for:
      minutes: 5
    id: outage
  - trigger: time
    at: 09:00:00
    id: reminder
  conditions:
  - condition: numeric_state
    entity_id: sensor.unavailable_lights
    above: 0
  - condition: or
    conditions:
    - condition: trigger
      id: reminder
    - condition: template
      value_template: '{{ (trigger.to_state.state | int(0)) > ((trigger.from_state.state
        if trigger.from_state else ''0'') | int(0)) }}'
  actions:
  - variables:
      stale_lights: '{{ states.light | selectattr(''state'', ''eq'', ''unavailable'')
        | map(attribute=''name'') | list | join('', '') }}'
  - action: notify.send_message
    target:
      entity_id: notify.household_notify
    data:
      title: "\U0001F4A1 Unavailable Lights"
      message: '{{ ''Still unavailable'' if trigger.id == ''reminder'' else ''Unavailable''
        }}: {{ stale_lights }}'
  mode: single
- id: '1789245515428'
  alias: Daily Mode Reset
  description: 'Native replacement for Node-RED''s "Check status and auto-disable
    if enabled" flow. Fixes two bugs: Night Mode check was testing party_mode instead
    of night_mode, and both checks had inverted halt logic (disabling+notifying only
    when already off, doing nothing when actually left on). At 07:00, disables night_mode
    and party_mode if either is left on.'
