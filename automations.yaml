- id: '1789244273397'
  alias: Front Door Autolock
  description: 'Native replacement for Node-RED''s "Lock / Unlock Front Door" flow:
    locks the front door at 21:30, and also re-locks it if found unlocked for 1+ minute
    overnight (21:35-08:00). Skipped entirely if party_mode is on. Verifies the lock
    actually engaged.'
  triggers:
  - trigger: time
    at: '21:30:00'
    id: scheduled
  - trigger: state
    entity_id: lock.inngangsdor
    to: unlocked
    for:
      minutes: 1
    id: door_unlocked
  conditions:
  - condition: or
    conditions:
    - condition: trigger
      id: scheduled
    - condition: and
      conditions:
      - condition: trigger
        id: door_unlocked
      - condition: time
        after: '21:35:00'
        before: 08:00:00
  actions:
  - if:
    - condition: state
      entity_id: input_boolean.party_mode
      state: 'on'
    then:
    - action: notify.send_message
      target:
        entity_id: notify.household_notify
      data:
        title: "\U0001F510 Front Door"
        message: Party mode enabled — not locked automatically
    else:
    - if:
      - condition: state
        entity_id: lock.inngangsdor
        state: locked
      then:
      - action: notify.send_message
        target:
          entity_id: notify.household_notify
        data:
          title: "\U0001F510 Front Door"
          message: Already locked
      else:
      - action: lock.lock
        target:
          entity_id: lock.inngangsdor
        data:
          code: 056805
      - action: notify.send_message
        target:
          entity_id: notify.household_notify
        data:
          title: "\U0001F510 Front Door"
          message: Locked automatically
      - delay:
          minutes: 1
      - if:
        - condition: state
          entity_id: lock.inngangsdor
          state: unlocked
        then:
        - action: notify.send_message
          target:
            entity_id: notify.household_notify
          data:
            title: "\U0001F510 Front Door"
            message: Lock failed
            data:
              push:
                sound:
                  critical: 1
                  name: default
                  volume: 1
  mode: single
