- id: '1788154320330'
  alias: Namron Thermostat Energy Refresh
  description: 'Namron Edge Thermostats still do not spontaneously report their energy
    attribute as of Zigbee2MQTT 2.14.2 (verified 2026-10-02: energy stayed flat for
    ~1h45m while power showed heating, then jumped as soon as a configure was sent).
    Force a fresh read every 30 minutes via device configure so the Energy Dashboard
    does not go stale. The screen_on_time reset that configure used to cause is fixed
    in 2.14.2 (verified across ~7 consecutive runs), so the old delay + always_on
    re-apply steps were removed. Covers both the Bathroom and Washroom units.'
  triggers:
  - trigger: time_pattern
    minutes: /30
  conditions: []
  actions:
  - action: mqtt.publish
    data:
      topic: zigbee2mqtt/bridge/request/device/configure
      payload: '{"id": "Namron Edge Thermostat Bathroom"}'
  - action: mqtt.publish
    data:
      topic: zigbee2mqtt/bridge/request/device/configure
      payload: '{"id": "Namron Edge Thermostat Washroom"}'
  mode: single
